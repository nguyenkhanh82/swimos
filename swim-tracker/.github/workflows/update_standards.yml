name: Update Time Standards

on:
  schedule:
    # Run at 00:00 on day 1 of every 3rd month (Jan, Apr, Jul, Oct)
    - cron: '0 0 1 */3 *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-standards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract Time Standards (2025-2028)
        run: |
          # 1. Download the Hy-Tek zip
          # 2. Extract .st2 files
          # 3. Parse them into JSON
          # 4. Update src/data/standards_seed.json
          # (For now, we will run a placeholder script or the inspect script if implemented)
          echo "Automation to be implemented using parsed Hy-Tek files."
          # node scripts/download_and_parse_hytek.js

      - name: Seed Database
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Need a service role key if RLS allows write only for admin, or use the existing key if allowed.
        run: npx tsx scripts/seed_standards.ts

      - name: Create Pull Request (if changes)
        uses: peter-evans/create-pull-request@v5
        with:
          title: "Update Time Standards (Quarterly)"
          body: "Automated update of time standards from USA Swimming."
          branch: "update-time-standards"
          base: "main"
